name: Build and SEO check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-seo
  cancel-in-progress: true

jobs:
  build-and-seo:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build with prerendering
        run: bun run build
        timeout-minutes: 10
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: SEO regression check (prerendered dist/)
        run: bun run check:prerender-seo

      - name: Ping IndexNow (Bing, Yandex)
        run: node scripts/ping-indexnow.mjs
        continue-on-error: true
